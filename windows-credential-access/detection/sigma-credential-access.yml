# Sigma detection for Windows credential access. Tune paths and allowlist your
# backup/EDR tooling. Highest-value first: LSASS access and DCSync.

title: LSASS access with credential-theft rights
id: 9a2d1f00-7b4c-4a1e-9c2a-1f00a1b2c3d1
status: experimental
description: >
  A process opened lsass.exe with access rights typical of a memory dump for
  credential extraction. Sysmon ProcessAccess (event 10).
references:
  - https://jperezduerto.info/techniques/windows-credential-access/
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\wininit.exe'
  condition: selection and not filter_known
falsepositives:
  - Some EDR and backup agents (allowlist their SourceImage)
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
---
title: LSASS dump via comsvcs MiniDump
id: 9a2d1f00-7b4c-4a1e-9c2a-1f00a1b2c3d2
status: experimental
description: The comsvcs.dll MiniDump living-off-the-land path to dump LSASS.
references:
  - https://jperezduerto.info/techniques/windows-credential-access/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
---
title: Registry hive export for offline credential extraction
id: 9a2d1f00-7b4c-4a1e-9c2a-1f00a1b2c3d3
status: experimental
description: reg.exe or esentutl saving SAM/SYSTEM/SECURITY hives.
references:
  - https://jperezduerto.info/techniques/windows-credential-access/
logsource:
  product: windows
  category: process_creation
detection:
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains: 'save'
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\system'
      - 'hklm\security'
  condition: selection_reg
falsepositives:
  - Legitimate backup scripts (allowlist them)
level: high
tags:
  - attack.credential_access
  - attack.t1003.002
---
title: DCSync from a non-domain-controller
id: 9a2d1f00-7b4c-4a1e-9c2a-1f00a1b2c3d4
status: experimental
description: >
  A directory replication (DRSUAPI GetNCChanges) request seen via 4662 with the
  replication control-access GUIDs. Alert when the requesting account is not a
  domain controller.
references:
  - https://jperezduerto.info/techniques/windows-credential-access/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'   # DS-Replication-Get-Changes
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'   # DS-Replication-Get-Changes-All
  filter_dc:
    SubjectUserName|endswith: '$'                 # tune to your actual DC accounts
  condition: selection and not filter_dc
falsepositives:
  - Genuine domain controllers (allowlist their machine accounts precisely)
level: critical
tags:
  - attack.credential_access
  - attack.t1003.006
